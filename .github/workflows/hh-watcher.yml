name: HH Watcher

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  check-headhunter:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger AI Job Police HH watcher
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Repository secret CRON_SECRET is not configured."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --retry-delay 5 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://aijibpolice.vercel.app/api/cron-hh"
